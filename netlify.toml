# Extensionless duplicates that Google has indexed alongside their .html
# canonical - force a single redirect to the canonical URL instead of
# relying on Netlify's default clean-URL rewrite (which serves both as 200).
[[redirects]]
  from = "/bathroom-remodel-clovis"
  to = "/bathroom-remodel-clovis.html"
  status = 301
  force = true

[[redirects]]
  from = "/clovis-bathroom-remodel-double-vanity-patterned-shower"
